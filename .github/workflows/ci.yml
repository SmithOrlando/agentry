# Runs on every push and pull request: backend tests, API-doc completeness, Vue production build, Docker images.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python scripts/gen_api_docs.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/check.py

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Start and check health
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && exit 0; sleep 2; done
          docker compose logs; exit 1
