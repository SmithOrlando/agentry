# Serves the built Vue app and forwards API + webhook traffic to the Flask service,
# so the browser and WhatsApp providers see ONE origin (cookies, CSRF and webhook URLs just work).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;            # keep >= MAX_UPLOAD_MB on the API

    location ~ ^/(api|webhooks|healthz) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # Playground waits for the model
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path renders index.html; Vue Router takes over.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
        try_files $uri $uri/ /index.html;
    }
}
